    <script>
    (function () {
      const theme = document.cookie.split('; ').find(row => row.startsWith('theme='))?.split('=')[1];
      if (theme === 'dark') {
        document.write('<link rel="stylesheet" href="css/glowy.css">');
      } else {
        document.write('<link rel="stylesheet" href="css/neo.css">');
      }
    })();
    </script>
